name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run the engine tests
        run: dotnet run --project tests -c Release

      - name: Build the Windows app
        run: dotnet build src/BinDay.csproj -c Release

      - name: Assemble the shippable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src/bin/Release/net48/BinDay.exe dist/
          Copy-Item src/bin/Release/net48/BinDay.exe.config dist/
          Copy-Item installer/Install.bat, installer/Install.ps1, installer/Uninstall.bat, installer/Uninstall.ps1 dist/
          Copy-Item site/../dist/HOW-TO-INSTALL.txt dist/ -ErrorAction SilentlyContinue

      - name: Zip it up
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath BinDay-windows.zip -Force

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            BinDay-windows.zip `
            --repo "${{ github.repository }}" `
            --title "BinDay ${{ github.ref_name }}" `
            --generate-notes
